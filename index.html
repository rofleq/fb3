
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frickbears 3</title>

<style>
* {
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: Arial, sans-serif;
}

#loading {
    text-align: center;
}

#loading p {
    margin-top: 12px;
    color: #888;
    font-size: 13px;
}

.spinner {
    width: 30px;
    height: 30px;
    border: 3px solid #333;
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: auto;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div id="loading">
    <div class="spinner"></div>
    <p>Launching Frickbears 3...</p>
</div>

<script>
const GAME_URL = "https://rofleq.github.io/frickbears3port/";

// Redirect directly to the original game loader.
window.location.replace(GAME_URL);
</script>

<noscript>
    <a href="https://rofleq.github.io/frickbears3port/">
        Launch Frickbears 3
    </a>
</noscript>

</body>
</html>
