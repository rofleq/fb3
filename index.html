
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Five Nights at Frickbear's 3</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: #000;
}

#fullscreen {
    position: fixed;
    z-index: 10;
    right: 15px;
    bottom: 15px;
    padding: 10px 15px;
    background: rgba(20, 20, 20, 0.85);
    color: white;
    border: 1px solid #555;
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
}

#fullscreen:hover {
    background: #444;
}
</style>
</head>

<body>

<iframe
    id="game"
    src="https://www.miniplay.com/embed/five-nights-at-frickbears-3"
    allow="autoplay; fullscreen; gamepad"
    allowfullscreen>
</iframe>

<button id="fullscreen" onclick="toggleFullscreen()">
    ⛶
</button>

<script>
function toggleFullscreen() {
    const game = document.getElementById("game");

    if (!document.fullscreenElement) {
        game.requestFullscreen().catch(() => {
            document.documentElement.requestFullscreen();
        });
    } else {
        document.exitFullscreen();
    }
}
</script>

</body>
</html>
